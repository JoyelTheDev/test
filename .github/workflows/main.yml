name: Monitor Java Obfuscators

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write      # ← This is the fix
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Search GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            gh search repos "java obfuscator" --language java --created ">=2025-01-01" --sort updated --limit 100 --json name,url,updatedAt
            gh search repos "java obfuscation" --language java --created ">=2025-01-01" --sort updated --limit 100 --json name,url,updatedAt
            gh search repos --topic obfuscation --language java --created ">=2025-01-01" --sort updated --limit 100 --json name,url,updatedAt
          } | jq -s '[.[][]] | unique_by(.url) | .[] | "\(.updatedAt) | \(.name) | \(.url)"' -r > results.txt
          cat results.txt

      - name: Create Issue if results found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s results.txt ]; then
            gh issue create \
              --title "Java Obfuscator Update $(date +%Y-%m-%d)" \
              --body "$(cat results.txt)" \
              --repo JoyelTheDev/test
          else
            echo "No results found, skipping issue creation."
          fi
